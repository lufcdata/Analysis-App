name: Arsenal vs Opta Analyst Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout Analysis-App
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install duckdb boto3 pandas

      - name: Run Arsenal R2 vs Opta audit read-only
        run: python v2/audit_arsenal_vs_opta.py

      - name: Show comparison
        if: always()
        run: |
          echo '--- comparison.csv ---'
          cat arsenal-audit/comparison.csv || true

      - name: Upload Arsenal audit evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arsenal-vs-opta-audit-${{ github.run_id }}
          path: arsenal-audit/**
          if-no-files-found: warn
          retention-days: 14

      - name: Confirm read-only behavior
        if: always()
        run: echo 'Audit only. No R2 upload, mutation, promotion, delete, or deployment step exists.'
