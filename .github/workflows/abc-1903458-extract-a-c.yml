name: A-C 1903458 Golden and R2 Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-a-and-c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Analysis-App
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only extraction dependencies
        run: python -m pip install duckdb boto3 pandas

      - name: Fetch locked A golden fixture
        run: |
          set -euxo pipefail
          mkdir -p abc-1903458
          python - <<'PY'
          import base64, json, os, urllib.request
          repo = 'lufcdata/pitch-plot-app'
          ref = '9b8968eb2b5625f27e2b593d905dc425933e74a0'
          path = 'v2/fixtures/whoscored/1903458.json'
          url = f'https://api.github.com/repos/{repo}/contents/{path}?ref={ref}'
          req = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Analysis-App-A-C-audit',
          })
          with urllib.request.urlopen(req) as r:
              payload = json.load(r)
          content = base64.b64decode(payload['content'])
          open('abc-1903458/A_golden_raw.json', 'wb').write(content)
          print({'bytes': len(content), 'source_sha': payload.get('sha')})
          PY
          echo 'cb037d6c8c69b6d83a93fffbb404de92429c45268752d5f3d05d599edb145093  abc-1903458/A_golden_raw.json' | sha256sum --check -

      - name: Extract A and C evidence read-only
        run: |
          python v2/extract_abc_1903458.py \
            --golden abc-1903458/A_golden_raw.json \
            --out abc-1903458 \
            --r2-key football/staging/2025-26-whoscored-cards.duckdb

      - name: Upload A and C evidence
        uses: actions/upload-artifact@v4
        with:
          name: abc-1903458-a-c-${{ github.run_id }}
          path: abc-1903458/**
          if-no-files-found: error
          retention-days: 14

      - name: Confirm read-only behavior
        if: always()
        run: echo 'A/C extraction complete. No R2 upload, copy, delete, promotion, database mutation, or deployment step exists.'
