name: A-C 1903458 Golden and R2 Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-a-and-c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout Analysis-App
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only extraction dependencies
        run: python -m pip install duckdb boto3 pandas

      - name: Record locked A reference
        run: |
          mkdir -p abc-1903458
          cat > abc-1903458/A_REFERENCE.txt <<'EOF'
          Locked A golden reference for WhoScored match 1903458
          Events: 1472
          SHA256: cb037d6c8c69b6d83a93fffbb404de92429c45268752d5f3d05d599edb145093
          Historical pitch-plot-app commit: 9b8968eb2b5625f27e2b593d905dc425933e74a0
          C extraction is intentionally independent so cross-repository access cannot block database forensics.
          EOF

      - name: Extract C event/stat evidence from R2 read-only
        run: |
          python v2/extract_abc_1903458.py \
            --out abc-1903458 \
            --r2-key football/staging/2025-26-whoscored-cards.duckdb

      - name: Extract C match_passes evidence from R2 read-only
        run: python v2/extract_match_passes_1903458.py

      - name: Upload C evidence and A reference
        uses: actions/upload-artifact@v4
        with:
          name: abc-1903458-a-ref-c-${{ github.run_id }}
          path: abc-1903458/**
          if-no-files-found: error
          retention-days: 14

      - name: Confirm read-only behavior
        if: always()
        run: echo 'C extraction complete. No R2 upload, copy, delete, promotion, database mutation, or deployment step exists.'
