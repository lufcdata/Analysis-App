name: LUFCDATA API smoke

on:
  push:
    branches:
      - build/lufcdata-v2-api
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile runtime
        run: python -m compileall -q app.py v2
      - name: Import standalone app
        run: python -c "from app import app; print(app.url_map)"
      - name: Verify spatial metric contract
        run: |
          python - <<'PY'
          from v2.spatial_plot_data import canonical_to_portrait
          from v2.canonical_progressive_pass_metrics import count_progressive_passes

          assert canonical_to_portrait(100, 50) == (50.0, 0.0)
          assert canonical_to_portrait(0, 50) == (50.0, 100.0)

          event = {
              "eventId": "smoke-pass-1",
              "type": {"id": 1, "displayName": "Pass"},
              "period": {"displayName": "FirstHalf"},
              "outcomeType": {"id": 1, "displayName": "Successful"},
              "teamId": "team-a",
              "playerId": "player-a",
              "x": 50,
              "y": 50,
              "qualifiers": [
                  {"type": {"displayName": "PassEndX"}, "value": "80"},
                  {"type": {"displayName": "PassEndY"}, "value": "50"},
              ],
          }
          assert count_progressive_passes([event], team_id="team-a") == 1
          print("canonical spatial contract OK")
          PY
      - name: Verify older snapshot match inventory compatibility
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import duckdb
          from v2.match_inventory import get_match_inventory

          with tempfile.TemporaryDirectory() as tmp:
              db = Path(tmp) / "old.duckdb"
              conn = duckdb.connect(str(db))
              conn.execute("CREATE TABLE seasons (season_id VARCHAR, season_name VARCHAR)")
              conn.execute("CREATE TABLE teams (team_id VARCHAR, team_name VARCHAR)")
              conn.execute("CREATE TABLE matches (match_id VARCHAR, season_id VARCHAR, match_date DATE, home_team_id VARCHAR, away_team_id VARCHAR)")
              conn.execute("INSERT INTO seasons VALUES ('s1', '2025/26')")
              conn.execute("INSERT INTO teams VALUES ('h', 'Leeds United'), ('a', 'Arsenal')")
              conn.execute("INSERT INTO matches VALUES ('m1', 's1', DATE '2026-01-01', 'h', 'a')")
              conn.close()

              payload = get_match_inventory(db_path=db)
              assert payload['matchday_available'] is False
              assert len(payload['matches']) == 1
              match = payload['matches'][0]
              assert match['match_id'] == 'm1'
              assert match['kickoff_time'] is None
              assert match['home_score'] is None
              assert match['away_score'] is None
              assert match['status'] is None
              assert match['whoscored_ingested'] is False
              assert match['sofascore_ingested'] is False
              print("older snapshot inventory compatibility OK")
          PY
      - name: Verify Metrics Bible production materialization
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          import duckdb

          from v2.canonical_materialize import materialize_match
          from v2.metric_registry import METRIC_SET_VERSION

          with tempfile.TemporaryDirectory() as tmp:
              db = Path(tmp) / "materialize.duckdb"
              conn = duckdb.connect(str(db))
              conn.execute("CREATE TABLE matches (match_id VARCHAR, home_team_id VARCHAR, away_team_id VARCHAR)")
              conn.execute("CREATE TABLE players (player_id VARCHAR, position VARCHAR)")
              conn.execute("CREATE TABLE player_match_stats (match_id VARCHAR, player_id VARCHAR, team_id VARCHAR, mins_played DOUBLE)")
              conn.execute("""CREATE TABLE match_events (
                  event_id VARCHAR, match_id VARCHAR, team_id VARCHAR, player_id VARCHAR,
                  source VARCHAR, event_type VARCHAR, period VARCHAR, minute INTEGER,
                  expanded_minute INTEGER, second INTEGER, time_seconds INTEGER,
                  x DOUBLE, y DOUBLE, end_x DOUBLE, end_y DOUBLE, outcome BOOLEAN,
                  metadata_json VARCHAR
              )""")
              conn.execute("INSERT INTO matches VALUES ('m1','team-h','team-a')")
              conn.execute("INSERT INTO players VALUES ('player-h','CM'),('player-a','CM')")
              conn.execute("INSERT INTO player_match_stats VALUES ('m1','player-h','team-h',90),('m1','player-a','team-a',90)")

              rows = [
                  ('e1','m1','team-h','player-h','FirstHalf',10,10,0,600,50,50,80,50,True,{
                      'eventId':'e1','type':{'displayName':'Pass'},'period':{'displayName':'FirstHalf'},
                      'outcomeType':{'displayName':'Successful'},'teamId':'team-h','playerId':'player-h',
                      'x':50,'y':50,'isTouch':True,
                      'qualifiers':[{'type':{'displayName':'PassEndX'},'value':'80'},{'type':{'displayName':'PassEndY'},'value':'50'}],
                  }),
                  ('e2','m1','team-a','player-a','FirstHalf',11,11,0,660,40,40,60,40,True,{
                      'eventId':'e2','type':{'displayName':'Pass'},'period':{'displayName':'FirstHalf'},
                      'outcomeType':{'displayName':'Successful'},'teamId':'team-a','playerId':'player-a',
                      'x':40,'y':40,'isTouch':True,
                      'qualifiers':[{'type':{'displayName':'PassEndX'},'value':'60'},{'type':{'displayName':'PassEndY'},'value':'40'}],
                  }),
                  ('e3','m1',None,None,'SecondHalf',90,90,0,5400,None,None,None,None,None,{
                      'eventId':'e3','type':{'displayName':'End'},'period':{'displayName':'SecondHalf'},
                      'minute':90,'expandedMinute':90,'second':0,
                  }),
              ]
              for event_id, match_id, team_id, player_id, period, minute, expanded, second, clock, x, y, end_x, end_y, outcome, meta in rows:
                  conn.execute(
                      "INSERT INTO match_events VALUES (?,?,?,?, 'whoscored','raw_whoscored',?,?,?,?,?,?,?,?,?,?,?)",
                      [event_id, match_id, team_id, player_id, period, minute, expanded, second, clock, x, y, end_x, end_y, outcome, json.dumps(meta)],
                  )
              conn.close()

              report = materialize_match(db, 'm1')
              assert report['status'] == 'materialised'
              conn = duckdb.connect(str(db), read_only=True)
              team_rows = conn.execute(
                  "SELECT COUNT(*) FROM canonical_metric_values WHERE metric_set_version=? AND match_id='m1' AND scope='team'",
                  [METRIC_SET_VERSION],
              ).fetchone()[0]
              player_rows = conn.execute(
                  "SELECT COUNT(*) FROM canonical_metric_values WHERE metric_set_version=? AND match_id='m1' AND scope='player'",
                  [METRIC_SET_VERSION],
              ).fetchone()[0]
              exposure_rows = conn.execute(
                  "SELECT COUNT(*) FROM canonical_player_exposure WHERE metric_set_version=? AND match_id='m1'",
                  [METRIC_SET_VERSION],
              ).fetchone()[0]
              progressive = conn.execute(
                  "SELECT metric_value FROM canonical_metric_values WHERE metric_set_version=? AND match_id='m1' AND scope='player' AND player_id='player-h' AND metric_key='progressive_passes'",
                  [METRIC_SET_VERSION],
              ).fetchone()
              conn.close()

              assert team_rows > 0
              assert player_rows > 0
              assert exposure_rows == 2
              assert progressive is not None and float(progressive[0]) == 1.0
              print('Metrics Bible production materialization OK')
          PY
      - name: Verify raw WhoScored spatial player payload
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          import duckdb

          from v2.spatial_plot_data import build_match_spatial_payload

          with tempfile.TemporaryDirectory() as tmp:
              db = Path(tmp) / "spatial.duckdb"
              conn = duckdb.connect(str(db))
              conn.execute("CREATE TABLE teams (team_id VARCHAR, team_name VARCHAR)")
              conn.execute("CREATE TABLE players (player_id VARCHAR, player_name VARCHAR)")
              conn.execute("CREATE TABLE matches (match_id VARCHAR, match_date DATE, home_team_id VARCHAR, away_team_id VARCHAR)")
              conn.execute("CREATE TABLE player_match_stats (match_id VARCHAR, player_id VARCHAR, team_id VARCHAR, mins_played DOUBLE)")
              conn.execute("""CREATE TABLE match_events (
                  event_id VARCHAR, match_id VARCHAR, team_id VARCHAR, player_id VARCHAR,
                  source VARCHAR, event_type VARCHAR, period VARCHAR, minute INTEGER,
                  expanded_minute INTEGER, second INTEGER, time_seconds INTEGER,
                  x DOUBLE, y DOUBLE, end_x DOUBLE, end_y DOUBLE, outcome BOOLEAN,
                  metadata_json VARCHAR
              )""")
              conn.execute("INSERT INTO teams VALUES ('team-h','Leeds United'),('team-a','Arsenal')")
              conn.execute("INSERT INTO players VALUES ('player-h','Leeds Player'),('player-a','Arsenal Player')")
              conn.execute("INSERT INTO matches VALUES ('m1',DATE '2026-01-01','team-h','team-a')")
              conn.execute("INSERT INTO player_match_stats VALUES ('m1','player-h','team-h',90),('m1','player-a','team-a',90)")
              events = [
                  ('e1','team-h','player-h','FirstHalf',10,600,55,45,{'eventId':'e1','type':{'displayName':'BallTouch'},'isTouch':True}),
                  ('e2','team-a','player-a','SecondHalf',55,3300,35,60,{'eventId':'e2','type':{'displayName':'BallTouch'},'isTouch':True}),
              ]
              for event_id, team_id, player_id, period, minute, clock, x, y, meta in events:
                  meta.update({'period':{'displayName':period},'teamId':team_id,'playerId':player_id,'minute':minute,'x':x,'y':y})
                  conn.execute(
                      "INSERT INTO match_events VALUES (?,?,?,?, 'whoscored','raw_whoscored',?,?,?,0,?,?,?,NULL,NULL,NULL,NULL,?)",
                      [event_id,'m1',team_id,player_id,period,minute,minute,clock,x,y,json.dumps(meta)],
                  )
              conn.close()

              payload = build_match_spatial_payload('m1', db_path=db)
              assert payload['match']['home_team'] == 'Leeds United'
              assert len(payload['touches']) == 2
              assert {row['player_id'] for row in payload['average_positions']} == {'player-h','player-a'}
              assert payload['passes'] == []
              assert payload['carry_readiness']['sofascore_complete'] is False
              print('raw WhoScored spatial player payload OK')
          PY
