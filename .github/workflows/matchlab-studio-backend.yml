name: MatchLab Studio Backend Checks

on:
  push:
    branches: [matchlab-v2-web]
  pull_request:
    branches: [matchlab-v2-web]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Studio backend
        run: |
          python -m py_compile \
            matchlab_web/backend/main.py \
            matchlab_web/backend/studio_entry.py \
            matchlab_web/backend/studio_main.py \
            v2/matchday_studio_contract.py \
            v2/canonical_match_stats.py
      - name: Verify exact 33-stat contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('v2/matchday_studio_contract.py')
          tree = ast.parse(path.read_text())
          count = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'MATCH_STATS' and isinstance(node.value, ast.Tuple):
                          count = len(node.value.elts)
          if count != 33:
              raise SystemExit(f'Expected exactly 33 Match Stats; found {count}')
          print('Match Stats contract: 33/33')
          PY
      - name: Verify period and imagery safety contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          entry = Path('matchlab_web/backend/studio_entry.py').read_text()
          studio = Path('matchlab_web/backend/studio_main.py').read_text()
          importer = Path('matchlab_web/backend/main.py').read_text()

          required_entry = [
              '/studio-match-stats',
              'first_half',
              'second_half',
              'provider-period-raw',
              'canonical_period_available',
              '/team-logos/{team_slug}.png',
              '/player-images/{player_slug}.png',
          ]
          missing = [item for item in required_entry if item not in entry]
          if missing:
              raise SystemExit(f'Missing Studio safety contract(s): {missing}')

          required_period = [
              '/matches/{event_id}/period-capabilities',
              '_raw_period_available',
              'Half-specific Player Stats are unavailable',
              'Half-specific Metric Leaders are unavailable',
              'estimates are forbidden',
          ]
          missing = [item for item in required_period if item not in studio]
          if missing:
              raise SystemExit(f'Missing honest player/leader period gate(s): {missing}')

          if '"player_actions": match_data.get("player_actions", {}) or {}' not in importer:
              raise SystemExit('Importer must preserve genuine player action streams')

          forbidden = ['api.sofascore.com/api/v1/player', 'api.sofascore.com/api/v1/team']
          found = [item for item in forbidden if item in entry or item in studio]
          if found:
              raise SystemExit(f'Forbidden SofaScore imagery endpoint found: {found}')

          print('Period handling, action preservation and local-only imagery contracts verified')
          PY
